<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}App{% endblock %}</title>
    <style>
        :root {
            --bg: #f4f6f8;
            --card-bg: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text);
            padding: 24px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            padding: 32px;
            width: 100%;
            max-width: 400px;
        }
        h1 {
            font-size: 1.4rem;
            margin: 0 0 6px;
        }
        p.subtitle {
            color: var(--muted);
            margin: 0 0 24px;
            font-size: 0.9rem;
        }
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
        }
        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            margin-bottom: 6px;
        }
        input:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
        .field { margin-bottom: 16px; }
        .errors { color: var(--danger); font-size: 0.8rem; margin: 0 0 4px; }
        button, .btn {
            width: 100%;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover, .btn:hover { background: var(--primary-hover); }
        button.danger { background: var(--danger); }
        button.danger:hover { background: var(--danger-hover); }
        .flash {
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 14px;
            font-size: 0.88rem;
        }
        .flash.success { background: #dcfce7; color: #166534; }
        .flash.danger { background: #fee2e2; color: #991b1b; }
        .flash.warning { background: #fef9c3; color: #854d0e; }
        .flash.info { background: #dbeafe; color: #1e40af; }
        .footer-link {
            text-align: center;
            margin-top: 18px;
            font-size: 0.88rem;
            color: var(--muted);
        }
        .footer-link a { color: var(--primary); text-decoration: none; }
        .footer-link a:hover { text-decoration: underline; }
        .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; }
    </style>
    {% block extra_styles %}{% endblock %}
</head>
<body>
    <div class="card">
        {% block flash %}
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        {% endblock %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
